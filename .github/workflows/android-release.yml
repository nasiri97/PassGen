name: Android Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: production-release

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      # Validate the tag before running any step that consumes signing secrets.
      - name: Verify tag belongs to master
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin master:refs/remotes/origin/master --no-tags

          TAG_COMMIT="$(git rev-list -n 1 "$GITHUB_REF_NAME")"
          MASTER_COMMIT="$(git rev-parse origin/master)"

          if ! git merge-base --is-ancestor "$TAG_COMMIT" "$MASTER_COMMIT"; then
            echo "::error::Release tag does not point to a commit in master history."
            exit 1
          fi

          echo "Verified: $GITHUB_REF_NAME points to a commit in master history."

      - name: Decode signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "$ANDROID_KEYSTORE_BASE64" ]]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is missing."
            exit 1
          fi

          KEYSTORE="$RUNNER_TEMP/release-key.p12"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"

          if [[ ! -s "$KEYSTORE" ]]; then
            echo "::error::Decoded keystore is empty."
            exit 1
          fi

          echo "Keystore decoded successfully."

      - name: Build signed Android release APK
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/release-key.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          for name in \
            ANDROID_KEYSTORE_FILE \
            ANDROID_KEYSTORE_PASSWORD \
            ANDROID_KEY_ALIAS \
            ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::$name is missing."
              exit 1
            fi
          done

          test -f "$ANDROID_KEYSTORE_FILE"

          ./gradlew :androidApp:assembleRelease

      - name: Locate release APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t APKS < <(
            find androidApp/build/outputs/apk/release \
              -maxdepth 1 -type f -name '*.apk' -print
          )

          if [[ "${#APKS[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one release APK, found ${#APKS[@]}."
            printf '%s\n' "${APKS[@]}"
            exit 1
          fi

          echo "path=${APKS[0]}" >> "$GITHUB_OUTPUT"

      - name: Verify APK signature
        env:
          APK_PATH: ${{ steps.apk.outputs.path }}
        shell: bash
        run: |
          set -euo pipefail

          APKSIGNER="$(
            find "$ANDROID_HOME/build-tools" \
              -type f -name apksigner -perm /111 -print |
              sort -V |
              tail -n 1
          )"

          if [[ -z "$APKSIGNER" ]]; then
            echo "::error::apksigner was not found."
            exit 1
          fi

          "$APKSIGNER" verify --verbose --print-certs "$APK_PATH"

      - name: Prepare release asset
        env:
          APK_PATH: ${{ steps.apk.outputs.path }}
        run: cp "$APK_PATH" "PassGen-${GITHUB_REF_NAME}.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: PassGen-${{ github.ref_name }}.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
